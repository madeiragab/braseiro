<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#14110f">
<title>Braseiro</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 256 256'%3E%3Crect width='256' height='256' rx='52' fill='%23231c18'/%3E%3Cpath d='M128 26C96 84 62 104 62 158c0 42 28 70 66 70s66-28 66-70c0-54-34-74-66-132z' fill='%23d9822f'/%3E%3Cpath d='M128 104c-16 30-32 42-32 72 0 26 14 40 32 40s32-14 32-40c0-30-16-42-32-72z' fill='%23fbc37a'/%3E%3C/svg%3E">
<style>
  :root{
    color-scheme: dark;   /* scrollbar, seleção e controles nativos vêm escuros */
    --bg:#14110f; --painel:#1c1815; --linha:#332c26; --texto:#e8ded2;
    --fraco:#9a8b7c; --brasa:#c9762f; --verde:#7d9a5e; --erro:#c05a4a;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    background:var(--bg);color:var(--texto);
    font:15px/1.65 "Iowan Old Style",Georgia,"Times New Roman",serif;
    display:flex;overflow:hidden;
  }
  button,input,textarea{font-family:inherit;color:inherit}

  /* ---------------- mesa ---------------- */
  #mesa{flex:1;display:flex;flex-direction:column;min-width:0}
  #rolagem{flex:1;overflow-y:auto;padding:46px 8px 8px}

  #marca{
    position:fixed;top:12px;left:20px;z-index:4;pointer-events:none;
    display:flex;align-items:center;gap:7px;
    font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;color:#6f6257;
  }
  #marca svg{width:15px;height:15px;opacity:.85}
  #fio{max-width:70ch;margin:0 auto;padding:0 20px 24px}

  .msg{margin:0 0 26px;white-space:pre-wrap;word-wrap:break-word}
  .msg.eu{
    color:var(--brasa);border-left:2px solid var(--brasa);
    padding-left:14px;font-style:italic;
  }
  .msg.eu.off{color:var(--fraco);border-color:var(--linha);font-style:normal;font-size:13.5px}
  .msg.mestre b{color:#f0e4d4}
  .msg.mestre i{color:var(--fraco)}
  .rolagem-dado{
    display:inline-block;background:#241d18;border:1px solid var(--linha);
    border-radius:4px;padding:1px 8px;font-size:13px;color:var(--verde);
    font-family:ui-monospace,Consolas,monospace;font-style:normal;
  }
  .erro{color:var(--erro);border-left:2px solid var(--erro);padding-left:14px;font-size:14px}
  .gravou{
    color:var(--fraco);font-size:12.5px;font-style:italic;
    border-top:1px dashed var(--linha);padding-top:8px;margin-top:-14px;margin-bottom:26px;
  }
  .cursor::after{content:"▊";color:var(--brasa);animation:pisca 1s steps(2) infinite}
  @keyframes pisca{50%{opacity:0}}

  /* ---------------- entrada ---------------- */
  #barra{border-top:1px solid var(--linha);background:var(--painel);padding:14px 20px 16px}
  #barra .dentro{max-width:70ch;margin:0 auto}
  #campo{
    width:100%;background:#14110f;border:1px solid var(--linha);border-radius:8px;
    padding:12px 14px;font-size:15px;resize:none;min-height:52px;max-height:180px;outline:none;
  }
  #campo:focus{border-color:var(--brasa)}
  #campo::placeholder{color:#5f544b}
  .dica{display:flex;gap:14px;align-items:center;margin-top:8px;font-size:12px;color:var(--fraco)}
  .dica kbd{background:#2a231e;border:1px solid var(--linha);border-radius:3px;padding:1px 5px;font-size:11px;font-family:inherit}
  .dica .sep{flex:1}
  .dica button{background:none;border:none;color:var(--fraco);cursor:pointer;font-size:12px;padding:2px 4px}
  .dica button:hover{color:var(--brasa)}

  /* ---------------- lateral ---------------- */
  #lado{
    width:400px;flex-shrink:0;border-left:1px solid var(--linha);background:var(--painel);
    display:flex;flex-direction:column;
  }
  #lado.fechado{display:none}
  #abas{display:flex;flex-wrap:wrap;gap:2px;padding:10px 10px 0;border-bottom:1px solid var(--linha)}
  #abas button{
    background:none;border:none;border-bottom:2px solid transparent;color:var(--fraco);
    cursor:pointer;padding:6px 9px;font-size:12.5px;border-radius:4px 4px 0 0;white-space:nowrap;
  }
  #abas button:hover{color:var(--texto)}
  #abas button.on{color:var(--brasa);border-bottom-color:var(--brasa)}
  #abas button.piscou{animation:destaca 1.4s ease-out}
  @keyframes destaca{0%{background:rgba(201,118,47,.45)}100%{background:transparent}}
  #editor{
    flex:1;width:100%;background:#14110f;border:none;outline:none;resize:none;
    padding:16px;font:13px/1.6 ui-monospace,Consolas,monospace;color:#cfc3b4;
  }
  #rodape{padding:10px 14px;border-top:1px solid var(--linha);display:flex;align-items:center;gap:10px;font-size:12px;color:var(--fraco)}
  #rodape button{background:var(--brasa);border:none;color:#14110f;font-weight:600;border-radius:5px;padding:5px 12px;cursor:pointer;font-size:12px}
  #rodape button:disabled{background:var(--linha);color:var(--fraco);cursor:default}

  #puxador{
    position:fixed;top:10px;right:10px;z-index:5;background:var(--painel);
    border:1px solid var(--linha);color:var(--fraco);border-radius:6px;
    padding:5px 10px;cursor:pointer;font-size:12px;
  }
  #puxador:hover{color:var(--brasa)}

  /* ---------------- seletor de campanha ---------------- */
  #mesas{
    display:flex;align-items:center;gap:6px;
    padding:10px 12px;border-bottom:1px solid var(--linha);
  }
  #mesas select{
    flex:1;min-width:0;background:#14110f;border:1px solid var(--linha);
    border-radius:5px;padding:5px 7px;font-size:12.5px;outline:none;
    /* sem color e color-scheme o texto sai preto no fundo escuro e a lista
       que o sistema abre vem branca no meio do tema */
    color:var(--texto);color-scheme:dark;font-family:inherit;cursor:pointer;
  }
  #mesas select option{background:#14110f;color:var(--texto)}
  #mesas select:focus{border-color:var(--brasa)}
  #mesas button{
    background:none;border:1px solid var(--linha);color:var(--fraco);
    border-radius:5px;padding:5px 8px;cursor:pointer;font-size:12.5px;line-height:1;
  }
  #mesas button:hover{color:var(--brasa);border-color:var(--brasa)}
  #ondeSalva{
    padding:0 12px 9px;font-size:11px;color:#6f6257;
    word-break:break-all;border-bottom:1px solid var(--linha);
  }

  /* ---------------- soltar livros ---------------- */
  #cortina{
    position:fixed;inset:0;z-index:50;display:none;
    background:rgba(20,17,15,.92);backdrop-filter:blur(2px);
    align-items:center;justify-content:center;text-align:center;
  }
  #cortina.on{display:flex}
  #cortina .caixa{
    border:2px dashed var(--brasa);border-radius:14px;padding:44px 60px;
    background:rgba(42,31,22,.6);
  }
  #cortina .chama{font-size:44px;line-height:1}
  #cortina h2{margin:14px 0 6px;font-size:21px;color:var(--texto);font-weight:normal}
  #cortina p{margin:0;font-size:13.5px;color:var(--fraco)}
  #btnLivros{
    width:100%;background:none;border:1px dashed var(--linha);color:var(--fraco);
    border-radius:6px;padding:9px;cursor:pointer;font-size:12.5px;margin-bottom:2px;
  }
  #btnLivros:hover{color:var(--brasa);border-color:var(--brasa)}
#btnSair{
  width:100%;margin-top:8px;padding:9px;border-radius:8px;cursor:pointer;
  background:transparent;border:1px dashed #4a3a34;color:#8b7a72;
  font:inherit;font-size:13px;transition:.15s
}
#btnSair:hover{color:#e0705a;border-color:#e0705a;border-style:solid}
  .xis{
    background:none;border:1px solid var(--linha);color:var(--fraco);
    border-radius:5px;padding:4px 8px;cursor:pointer;line-height:1;font-size:14px
  }
  .xis:hover{color:#e0705a;border-color:#e0705a}
  #listaLivros{margin-top:8px;display:flex;flex-direction:column;gap:3px}
  #listaLivros .item{
    display:flex;align-items:center;gap:6px;font-size:12px;color:var(--fraco);
    padding:4px 6px;border-radius:5px;background:#14110f
  }
  #listaLivros .item span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #listaLivros .item .kb{flex:none;color:#5f524c;font-size:11px}
  #listaLivros .item button{
    flex:none;background:none;border:none;color:#5f524c;cursor:pointer;
    font-size:15px;line-height:1;padding:0 3px
  }
  #listaLivros .item button:hover{color:#e0705a}
  #listaLivros .vazio{font-size:12px;color:#5f524c;padding:4px 6px}
#apagado{
  position:fixed;inset:0;z-index:99;display:none;place-items:center;
  background:#12100f;color:#8b7a72;text-align:center;font-size:15px;line-height:1.9
}

  ::-webkit-scrollbar{width:9px}
  ::-webkit-scrollbar-thumb{background:#332c26;border-radius:5px}
</style>
</head>
<body>

<div id="cortina">
  <div class="caixa">
    <div class="chama">🔥</div>
    <h2>solta os livros aqui</h2>
    <p>PDF, .md ou .txt — vão direto pra esta campanha</p>
  </div>
</div>

<div id="marca">
  <svg viewBox="0 0 256 256" aria-hidden="true">
    <path d="M128 26C96 84 62 104 62 158c0 42 28 70 66 70s66-28 66-70c0-54-34-74-66-132z" fill="#c9762f"/>
    <path d="M128 104c-16 30-32 42-32 72 0 26 14 40 32 40s32-14 32-40c0-30-16-42-32-72z" fill="#f6aa4a"/>
  </svg>
  Braseiro
</div>

<div id="mesa">
  <div id="rolagem"><div id="fio"></div></div>
  <div id="barra"><div class="dentro">
    <textarea id="campo" rows="1" placeholder="O que você faz?"></textarea>
    <div class="dica">
      <span><kbd>Enter</kbd> joga</span>
      <span><kbd>mestre:</kbd> fala com o Mestre fora da ficção</span>
      <span id="dicaIniciar" hidden><kbd>/iniciar campanha</kbd> começa a mesa</span>
      <span class="sep"></span>
      <button id="btnLimpar">apagar conversa</button>
    </div>
  </div></div>
</div>

<div id="apagado"><div>
  <div style="font-size:34px;margin-bottom:10px">🔥</div>
  o braseiro apagou.<br>
  <span style="color:#5f524c;font-size:13px">a memória foi liberada. pode fechar esta aba.</span>
</div></div>

<button id="puxador">campanha</button>
<div id="lado">
  <div id="mesas">
    <select id="selMesa" title="campanha aberta"></select>
    <button id="btnNova" title="começar outra campanha">+ nova</button>
    <button id="btnPasta" title="abrir a pasta no Explorador">📁</button>
    <button id="btnApagarMesa" class="xis" title="apagar esta campanha">×</button>
  </div>
  <div id="ondeSalva"></div>
  <div style="padding:0 12px 10px">
    <button id="btnLivros">📚 adicionar livros do sistema</button>
    <input type="file" id="arqLivros" multiple accept=".pdf,.md,.markdown,.txt" hidden>
    <div id="listaLivros"></div>
    <button id="btnSair" title="fecha o Mestre e libera a memória">🔥 apagar o braseiro</button>
  </div>
  <div id="abas"></div>
  <textarea id="editor" spellcheck="false"></textarea>
  <div id="rodape">
    <button id="btnSalvar" disabled>salvar</button>
    <span id="aviso">o Mestre lê estes arquivos a cada jogada</span>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
const fio = $("#fio"), rolagem = $("#rolagem"), campo = $("#campo");
let arquivos = [], atual = null, ocupado = false;

/* ---------- render ---------- */
function noFim(){ rolagem.scrollTop = rolagem.scrollHeight; }
function perto(){ return rolagem.scrollHeight - rolagem.scrollTop - rolagem.clientHeight < 120; }

function enfeita(t){
  return t
    .replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]))
    .replace(/\[([^\[\]]*?\d[^\[\]]*?)\]/g, '<span class="rolagem-dado">$1</span>')
    .replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>")
    .replace(/(^|[\s(])\*([^*\n]+)\*/g, "$1<i>$2</i>");
}
function bolha(classe, texto){
  const d = document.createElement("div");
  d.className = "msg " + classe;
  if (classe === "mestre") d.innerHTML = enfeita(texto); else d.textContent = texto;
  fio.appendChild(d); noFim(); return d;
}

/* ---------- lateral ---------- */
function pintarMesas(r){
  const s = $("#selMesa");
  s.innerHTML = "";
  for (const c of (r.campanhas || [])){
    const o = document.createElement("option");
    o.value = c; o.textContent = c;
    if (c === r.campanha) o.selected = true;
    s.appendChild(o);
  }
  $("#ondeSalva").textContent = r.pasta || "";
  pintarLivros(r.livros || []);
  // antes de /iniciar campanha ele é um chat comum: a dica só aparece aí
  $("#dicaIniciar").hidden = !!r.iniciada;
  $("#campo").placeholder = r.iniciada ? "O que você faz?" : "Converse, monte o personagem... e /iniciar campanha quando quiser começar";
}

function pintarLivros(livros){
  const c = $("#listaLivros");
  c.innerHTML = "";
  if (!livros.length){
    const v = document.createElement("div");
    v.className = "vazio"; v.textContent = "nenhum livro nesta campanha";
    c.appendChild(v); return;
  }
  for (const l of livros){
    const d = document.createElement("div"); d.className = "item";
    const s = document.createElement("span"); s.textContent = l.id; s.title = l.id;
    const k = document.createElement("span"); k.className = "kb"; k.textContent = l.kb + " KB";
    const b = document.createElement("button"); b.textContent = "×"; b.title = "apagar este livro";
    b.onclick = () => apagarLivro(l.id);
    d.append(s, k, b); c.appendChild(d);
  }
}

async function carregar(destacar){
  const r = await fetch("/api/estado", {cache:"no-store"}).then(r => r.json());
  arquivos = r.arquivos;
  pintarMesas(r);
  const abas = $("#abas");
  abas.innerHTML = "";
  for (const a of arquivos){
    const b = document.createElement("button");
    b.textContent = a.nome.replace(/^\d+-/, "");
    b.onclick = () => abrir(a.id);
    b.dataset.id = a.id;
    if (a.id === atual) b.className = "on";
    if (destacar && destacar.some(m => m.includes(a.nome.replace(/^\d+-/, "").replace("lore/","")))) b.classList.add("piscou");
    abas.appendChild(b);
  }
  if (!atual && arquivos.length) abrir(arquivos.find(a => a.id.includes("personagem"))?.id || arquivos[0].id);
  else if (atual){
    const a = arquivos.find(x => x.id === atual);
    if (a && document.activeElement !== $("#editor")) $("#editor").value = a.texto;
  }
  return r;
}
const soLeitura = id => id && id.startsWith("__");

function abrir(id){
  atual = id;
  const a = arquivos.find(x => x.id === id);
  const ed = $("#editor");
  ed.value = a ? a.texto : "";
  ed.readOnly = soLeitura(id);
  ed.style.opacity = soLeitura(id) ? .82 : 1;
  $("#btnSalvar").disabled = true;
  $("#btnSalvar").style.display = soLeitura(id) ? "none" : "";
  $("#aviso").textContent = soLeitura(id)
    ? "índice automático — os livros ficam em campanha\\livros\\"
    : "o Mestre lê estes arquivos a cada jogada";
  document.querySelectorAll("#abas button").forEach(b => b.classList.toggle("on", b.dataset.id === id));
}
$("#editor").oninput = () => { if (!soLeitura(atual)) $("#btnSalvar").disabled = false; };
$("#btnSalvar").onclick = async () => {
  await fetch("/api/salvar", {method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({id: atual, texto: $("#editor").value})});
  $("#btnSalvar").disabled = true;
  $("#aviso").textContent = "salvo — vale já na próxima jogada";
  setTimeout(() => $("#aviso").textContent = "o Mestre lê estes arquivos a cada jogada", 2600);
  const guarda = atual; await carregar(); atual = guarda;
};
$("#puxador").onclick = () => $("#lado").classList.toggle("fechado");

/* ---------- campanhas ---------- */
async function trocarMesa(nome){
  if (ocupado){ alert("Espera o Mestre terminar de escrever."); return; }
  const r = await fetch("/api/campanha", {method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({nome})}).then(r => r.json());
  atual = null;
  fio.innerHTML = "";
  const est = await carregar();
  if (est.historico && est.historico.length){
    for (const h of est.historico) bolha(h.papel === "user" ? "eu" : "mestre", h.texto);
  } else {
    bolha("mestre", "*Campanha **" + r.campanha + "** aberta. O braseiro está aceso.*");
  }
  noFim(); campo.focus();
}
$("#selMesa").onchange = e => trocarMesa(e.target.value);
$("#btnNova").onclick = () => {
  const n = prompt("Nome da nova campanha:\n(vira uma pasta em Documentos\\Braseiro)");
  if (n && n.trim()) trocarMesa(n.trim());
};
$("#btnPasta").onclick = () => fetch("/api/abrir-pasta", {method:"POST"});

async function apagarLivro(id){
  if (!confirm("Apagar o livro\n\n  " + id + "\n\nVai pra Lixeira do Windows, dá pra recuperar.")) return;
  const r = await fetch("/api/livros/apagar", {method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({id})}).then(r => r.json());
  if (!r.ok){ alert("Não consegui apagar: " + (r.erro || "erro")); return; }
  await carregar();
}

$("#btnApagarMesa").onclick = async () => {
  const nome = $("#selMesa").value;
  if (!nome) return;
  if (!confirm("Apagar a campanha\n\n  " + nome + "\n\nLeva junto ficha, diário, lore e livros dela.\nVai pra Lixeira do Windows, dá pra recuperar.")) return;
  const r = await fetch("/api/campanha/apagar", {method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({nome})}).then(r => r.json());
  if (!r.ok){ alert("Não consegui apagar: " + (r.erro || "erro")); return; }
  atual = null; fio.innerHTML = "";
  const est = await carregar();
  if (est.historico && est.historico.length){
    for (const h of est.historico) bolha(h.papel === "user" ? "eu" : "mestre", h.texto);
  } else {
    bolha("mestre", "*Campanha **" + est.campanha + "** aberta. O braseiro está aceso.*");
  }
  noFim();
};

$("#btnSair").onclick = async () => {
  if (!confirm("Apagar o braseiro?\n\nFecha o Mestre e descarrega o modelo da memória.\nA campanha já está salva no disco.")) return;
  $("#apagado").style.display = "grid";
  // o servidor morre no meio da resposta: o erro de rede aqui é o esperado
  try { await fetch("/api/sair", {method:"POST"}); } catch (e) {}
};

/* ---------- soltar livros ---------- */
async function engolirLivros(lista){
  const arqs = [...lista].filter(f => /\.(pdf|md|markdown|txt)$/i.test(f.name));
  if (!arqs.length){
    bolha("erro", "Só engulo .pdf, .md ou .txt. O resto não dá pra indexar.");
    return;
  }
  const aviso = bolha("mestre", "*Guardando " + arqs.length + " arquivo(s)…*");
  const ok = [], falhos = [];

  for (const f of arqs){
    aviso.innerHTML = enfeita("*Lendo **" + f.name + "**…*");
    try {
      const r = await fetch("/api/livros/soltar?nome=" + encodeURIComponent(f.name),
        {method:"POST", body:f}).then(r => r.json());
      if (r.ok && r.convertido) ok.push(f.name);
      else falhos.push(f.name + (r.motivo || r.erro ? " — " + (r.motivo || r.erro) : ""));
    } catch(e){
      falhos.push(f.name + " — " + e.message);
    }
  }

  let txt = "";
  if (ok.length)     txt += "**" + ok.length + " livro(s) no lugar.** " + ok.join(", ") + "\n\n";
  if (falhos.length) txt += "**Não deu pra ler " + falhos.length + ":**\n" + falhos.map(x => "· " + x).join("\n") + "\n\n*Esses provavelmente são escaneados. Abra no leitor de PDF, \"Salvar como\" texto, e solte o .txt aqui.*";
  if (ok.length && !falhos.length) txt += "*Já valem na próxima jogada. Veja a aba **livros** pra conferir o corte.*";
  aviso.innerHTML = enfeita(txt.trim());
  noFim();
  await carregar();
}

$("#btnLivros").onclick = () => $("#arqLivros").click();
$("#arqLivros").onchange = e => { engolirLivros(e.target.files); e.target.value = ""; };

let arrastando = 0;
window.addEventListener("dragenter", e => {
  if (!e.dataTransfer || ![...e.dataTransfer.types].includes("Files")) return;
  e.preventDefault(); arrastando++; $("#cortina").classList.add("on");
});
window.addEventListener("dragover", e => {
  if (e.dataTransfer && [...e.dataTransfer.types].includes("Files")) e.preventDefault();
});
window.addEventListener("dragleave", e => {
  if (--arrastando <= 0){ arrastando = 0; $("#cortina").classList.remove("on"); }
});
window.addEventListener("drop", e => {
  if (!e.dataTransfer || !e.dataTransfer.files.length) return;
  e.preventDefault(); arrastando = 0; $("#cortina").classList.remove("on");
  engolirLivros(e.dataTransfer.files);
});

/* ---------- jogar ---------- */
campo.addEventListener("input", () => {
  campo.style.height = "auto";
  campo.style.height = Math.min(campo.scrollHeight, 180) + "px";
});
campo.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey){ e.preventDefault(); jogar(); }
});

async function jogar(){
  const bruto = campo.value.trim();
  if (!bruto || ocupado) return;
  // "mestre:" no início fala com o Mestre por fora da ficção.
  // "//" segue valendo como atalho curto.
  const PREFIXO = /^\s*(mestre\s*:|\/\/)\s*/i;
  const diretor = PREFIXO.test(bruto);
  const texto = diretor ? bruto.replace(PREFIXO, "").trim() : bruto;
  if (!texto) return;

  campo.value = ""; campo.style.height = "auto";
  bolha(diretor ? "eu off" : "eu", (diretor ? "▸ " : "") + texto);

  ocupado = true;
  const alvo = bolha("mestre cursor", "");
  let acc = "";

  try {
    const r = await fetch("/api/turno", {method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({texto, diretor})});
    const leitor = r.body.getReader(), dec = new TextDecoder();
    let buf = "";
    for(;;){
      const {value, done} = await leitor.read();
      if (done) break;
      buf += dec.decode(value, {stream:true});
      const partes = buf.split("\n\n"); buf = partes.pop();
      for (const p of partes){
        const ev = /^event: (\w+)/m.exec(p), dt = /^data: (.*)$/m.exec(p);
        if (!ev || !dt) continue;
        const carga = JSON.parse(dt[1]);
        if (ev[1] === "texto"){
          const colado = perto();
          acc += carga.t;
          alvo.innerHTML = enfeita(acc);
          if (colado) noFim();
        } else if (ev[1] === "anotando"){
          alvo.classList.remove("cursor");
          const n = document.createElement("div");
          n.className = "gravou"; n.id = "anotando";
          n.textContent = "anotando na campanha…";
          fio.appendChild(n); if (perto()) noFim();
        } else if (ev[1] === "fim"){
          document.getElementById("anotando")?.remove();
          alvo.classList.remove("cursor");
          const est = await carregar(carga.mudou);
          if (carga.mudou && carga.mudou.length){
            const g = document.createElement("div");
            g.className = "gravou";
            g.textContent = "anotado na campanha — " + carga.mudou.join("  ·  ");
            fio.appendChild(g);
          }
        } else if (ev[1] === "erro"){
          alvo.classList.remove("cursor");
          bolha("erro", carga.msg);
        }
      }
    }
  } catch(e){
    alvo.classList.remove("cursor");
    bolha("erro", "Caiu a conexão com o servidor da mesa: " + e.message);
  }
  alvo.classList.remove("cursor");
  if (!acc.trim()) alvo.remove();
  ocupado = false; campo.focus(); noFim();
}

$("#btnLimpar").onclick = async () => {
  if (!confirm("Apaga só o histórico da conversa.\nO diário, a ficha e a lore continuam intactos.\n\nApagar?")) return;
  await fetch("/api/apagar-conversa", {method:"POST"});
  fio.innerHTML = "";
  bolha("mestre", "*Conversa limpa. A campanha continua — o Mestre ainda lembra pelo diário e pela lore.*");
};

/* ---------- inicio ---------- */
(async () => {
  const r = await carregar();
  if (r.historico && r.historico.length){
    for (const h of r.historico) bolha(h.papel === "user" ? "eu" : "mestre", h.texto);
  } else {
    bolha("mestre", "*O braseiro está aceso. Diga quem é o seu personagem — ou só escreva o que ele está fazendo agora, e eu descubro o resto no caminho.*");
  }
  noFim(); campo.focus();
})();
</script>
